<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subsecretaría de Recursos y Logística</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0B1121; color: #e2e8f0; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 1rem; }
        .menu-item.active { background: rgba(16, 185, 129, 0.1); color: #10b981; border-right: 3px solid #10b981; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-64 bg-slate-900 border-r border-slate-800 flex flex-col">
        <div class="p-6"><h1 class="text-emerald-500 font-bold tracking-wider text-sm flex items-center gap-2"><i data-lucide="activity"></i> SALUD PANEL</h1></div>
        <nav class="flex-1 mt-6 flex flex-col gap-2">
            <button onclick="switchView('territorio')" id="btn-territorio" class="menu-item active flex items-center gap-3 px-6 py-3 w-full text-left text-slate-400 font-medium text-sm"><i data-lucide="map"></i> TERRITORIO</button>
            <button onclick="switchView('ausentismo')" id="btn-ausentismo" class="menu-item flex items-center gap-3 px-6 py-3 w-full text-left text-slate-400 font-medium text-sm"><i data-lucide="users"></i> AUSENTISMO</button>
            <button onclick="switchView('irab')" id="btn-irab" class="menu-item flex items-center gap-3 px-6 py-3 w-full text-left text-slate-400 font-medium text-sm"><i data-lucide="thermometer"></i> IRAB 2026</button>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col h-screen overflow-y-auto bg-[#0B1121]">
        <header class="p-8 pb-4">
            <h2 class="text-3xl font-bold text-white mb-1">SUBSECRETARÍA DE RECURSOS Y LOGÍSTICA</h2>
            <p class="text-slate-400 text-sm">Centro de control y visualización de datos operativos</p>
        </header>

        <!-- Vista Territorio (Restaurada) -->
        <section id="view-territorio" class="px-8 pb-8 block">
            <div id="loader-territorio" class="text-center py-20"><i data-lucide="loader-2" class="w-12 h-12 animate-spin text-emerald-500 mx-auto"></i></div>
            <div id="content-territorio" class="hidden">
                <div id="kpi-container" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4 mb-8"></div>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="glass-card p-6"><canvas id="chart-territorio-1"></canvas></div>
                    <div class="glass-card p-6"><canvas id="chart-territorio-2"></canvas></div>
                </div>
            </div>
        </section>

        <!-- Vista Ausentismo (Pro) -->
        <section id="view-ausentismo" class="px-8 pb-8 hidden">
            <div class="flex flex-wrap gap-4 mb-6">
                <select id="filter-agente" class="bg-slate-800 text-white p-2 rounded border border-slate-700" onchange="filterAusentismo()">
                    <option value="">Todos los Agentes</option>
                </select>
                <select id="filter-mes" class="bg-slate-800 text-white p-2 rounded border border-slate-700" onchange="filterAusentismo()">
                    <option value="">Todos los Meses</option>
                    <option value="JULIO">Julio</option>
                    <option value="AGOSTO">Agosto</option>
                    <option value="SEPTIEMBRE">Septiembre</option>
                    <option value="OCTUBRE">Octubre</option>
                    <option value="NOVIEMBRE">Noviembre</option>
                    <option value="DICIEMBRE">Diciembre</option>
                </select>
            </div>
            
            <div id="content-ausentismo" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="glass-card p-6 border-t-4 border-rose-500"><p class="text-slate-400 text-sm">Inasistencias Totales</p><p id="aus-total" class="text-3xl font-bold text-white">0</p></div>
                    <div class="glass-card p-6 border-t-4 border-amber-500"><p class="text-slate-400 text-sm">Top Agente</p><p id="aus-max" class="text-lg font-bold text-white">-</p></div>
                    <div class="glass-card p-6 border-t-4 border-emerald-500"><p class="text-slate-400 text-sm">Nómina Activa</p><p id="aus-nomina" class="text-3xl font-bold text-white">0</p></div>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="glass-card p-6"><canvas id="chart-aus-mensual"></canvas></div>
                    <div class="glass-card p-6"><canvas id="chart-aus-agentes"></canvas></div>
                </div>
                <div class="glass-card overflow-hidden">
                    <table class="w-full text-sm text-left text-slate-300"><thead class="bg-slate-800 text-slate-400 uppercase"><tr><th class="px-6 py-4">AGENTE</th><th class="px-4 py-4">TOTAL</th></tr></thead><tbody id="tabla-ausentismo-body"></tbody></table>
                </div>
            </div>
        </section>

        <!-- Vista IRAB -->
        <section id="view-irab" class="px-8 pb-8 hidden">
            <div class="glass-card p-16 text-center border border-emerald-500/20"><h2 class="text-3xl text-white font-bold">Módulo IRAB 2026</h2><p class="text-slate-400 mt-4">En desarrollo.</p></div>
        </section>
    </main>

    <script>
        const URL_AUSENTISMO = 'https://script.google.com/macros/s/AKfycbw7tP5mgS3cfBpXi3-W_0Pks_tnZ7ncbEstZrF649byWy0YTsdmxLao_stLSK27F7Vblw/exec';
        let dataGlobalAusentismo = [];

        async function fetchAusentismo() {
            try {
                const response = await fetch(URL_AUSENTISMO);
                const data = await response.json();
                dataGlobalAusentismo = data;
                
                // Cargar Filtro Agentes
                const selectAgente = document.getElementById('filter-agente');
                const agentes = [...new Set(data.map(item => item.AGENTE))];
                agentes.forEach(a => selectAgente.innerHTML += `<option value="${a}">${a}</option>`);
                
                renderAusentismo(data);
            } catch(e) {
                console.error(e);
            }
        }

        function filterAusentismo() {
            const agente = document.getElementById('filter-agente').value;
            const mes = document.getElementById('filter-mes').value;
            
            let filtered = dataGlobalAusentismo;
            if (agente) filtered = filtered.filter(item => item.AGENTE === agente);
            // Si filtra por mes, calculamos la suma solo de ese mes
            renderAusentismo(filtered, mes);
        }

        function renderAusentismo(data, mesFiltro) {
            let totalGral = 0;
            let htmlRows = '';
            
            data.forEach(row => {
                let valor = mesFiltro ? (parseInt(row[mesFiltro]) || 0) : (parseInt(row.TOTAL) || 0);
                totalGral += valor;
                htmlRows += `<tr class="border-b border-slate-700">
                    <td class="px-6 py-3">${row.AGENTE}</td>
                    <td class="px-4 py-3 font-bold text-rose-400">${valor}</td>
                </tr>`;
            });
            
            document.getElementById('tabla-ausentismo-body').innerHTML = htmlRows;
            document.getElementById('aus-total').textContent = totalGral;
            document.getElementById('aus-nomina').textContent = data.length;
            
            // Gráficos básicos
            // Aquí podrías instanciar los Chart.js con los nuevos datos filtrados
        }

        function switchView(viewId) {
            document.querySelectorAll('section').forEach(s => s.classList.add('hidden'));
            document.getElementById(`view-${viewId}`).classList.remove('hidden');
            if(viewId === 'ausentismo') fetchAusentismo();
            lucide.createIcons();
        }
        
        // Initial setup
        lucide.createIcons();
    </script>
</body>
</html>
