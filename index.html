<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Operativos Sanitarios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Inter', system-ui, sans-serif; }
        .nav-active { border-right: 2px solid #10b981; background: #1e293b; color: #34d399; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex">

    <!-- Sidebar -->
    <aside class="w-64 bg-slate-900 border-r border-slate-800 hidden md:flex flex-col h-screen sticky top-0">
        <div class="p-6 border-b border-slate-800">
            <h2 class="text-emerald-400 font-bold tracking-widest text-sm uppercase">Salud Panel</h2>
        </div>
        <nav class="flex-1 p-4 space-y-2">
            <button onclick="showSection('view-kpi', this)" class="w-full text-left p-3 rounded-lg flex items-center gap-3 text-sm hover:bg-slate-800 nav-active">
                <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Vista General
            </button>
            <button onclick="showSection('view-table', this)" class="w-full text-left p-3 rounded-lg flex items-center gap-3 text-sm hover:bg-slate-800">
                <i data-lucide="table" class="w-4 h-4"></i> Registros
            </button>
        </nav>
    </aside>

    <main class="flex-1 p-8 overflow-y-auto">
        <section id="view-kpi" class="content-section space-y-6">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold text-white">Vista General</h1>
                <select id="filterSelect" onchange="processData()" class="bg-slate-800 border border-slate-700 text-slate-200 rounded-lg px-4 py-2 outline-none">
                    <option value="TODOS">Todos los tipos</option>
                </select>
            </div>

            <!-- KPIs -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800"><p class="text-slate-500 text-xs uppercase mb-1">TOTAL CAL</p><p id="kpi-cal" class="text-3xl font-bold text-indigo-400">0</p></div>
                <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800"><p class="text-slate-500 text-xs uppercase mb-1">COVID</p><p id="kpi-covid" class="text-3xl font-bold text-rose-400">0</p></div>
                <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800"><p class="text-slate-500 text-xs uppercase mb-1">TELEMEDICINA</p><p id="kpi-tele" class="text-3xl font-bold text-emerald-400">0</p></div>
            </div>

            <!-- Gráficos -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
                    <h3 class="text-sm font-semibold mb-4">Comparativa Indicadores</h3>
                    <canvas id="barChart" height="200"></canvas>
                </div>
                <div class="bg-slate-900 p-6 rounded-2xl border border-slate-800">
                    <h3 class="text-sm font-semibold mb-4">Distribución por Tipo</h3>
                    <canvas id="pieChart" height="200"></canvas>
                </div>
            </div>
        </section>

        <section id="view-table" class="content-section hidden">
            <h1 class="text-2xl font-bold text-white mb-6">Listado de Operativos</h1>
            <div class="bg-slate-900 rounded-2xl border border-slate-800 overflow-hidden">
                <table class="w-full text-sm text-left"><thead class="bg-slate-800/50 text-slate-400"><tr id="tableHead"></tr></thead><tbody id="tableBody"></tbody></table>
            </div>
        </section>
    </main>

    <script>
        // PEGA AQUÍ TU URL (MANTENLA ENTRE COMILLAS)
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyBjTUlBamDze2bBrHmLUl9eaDjjvXzb3S0HMvPFGxwpQ8ZXKQUTThSm4HsiN79zm_6/exec';
        let allData = [];
        let barChart, pieChart;

        async function fetchGoogleData() {
            try {
                const res = await fetch(GOOGLE_SCRIPT_URL);
                allData = await res.json();
                populateFilters();
                processData();
            } catch (err) { document.getElementById('tableBody').innerHTML = 'Error de conexión.'; }
        }

        function populateFilters() {
            const select = document.getElementById('filterSelect');
            const types = [...new Set(allData.map(r => r['TIPO OPERATIVO']))];
            types.forEach(t => {
                if(t) select.innerHTML += `<option value="${t}">${t}</option>`;
            });
        }

        function processData() {
            const filter = document.getElementById('filterSelect').value;
            const filtered = filter === "TODOS" ? allData : allData.filter(r => r['TIPO OPERATIVO'] === filter);
            
            // Cálculos
            const sums = { cal: 0, covid: 0, tele: 0, pers: 0, hsi: 0 };
            filtered.forEach(r => {
                sums.cal += Number(r['CAL (APLIC)'] || 0);
                sums.covid += Number(r['COVID'] || 0);
                sums.tele += Number(r['TELEMEDICINA'] || 0);
                sums.pers += Number(r['PERS VAC'] || 0);
                sums.hsi += Number(r['EMPADRONAMIENTO HSI'] || 0);
            });

            document.getElementById('kpi-cal').innerText = sums.cal;
            document.getElementById('kpi-covid').innerText = sums.covid;
            document.getElementById('kpi-tele').innerText = sums.tele;

            updateCharts(sums);
            renderTable(filtered);
        }

        function updateCharts(sums) {
            const ctxBar = document.getElementById('barChart').getContext('2d');
            const ctxPie = document.getElementById('pieChart').getContext('2d');

            if(barChart) barChart.destroy();
            if(pieChart) pieChart.destroy();

            barChart = new Chart(ctxBar, {
                type: 'bar',
                data: {
                    labels: ['CAL', 'COVID', 'Telemedicina', 'Pers. Vac', 'HSI'],
                    datasets: [{ label: 'Total', data: [sums.cal, sums.covid, sums.tele, sums.pers, sums.hsi], backgroundColor: ['#6366f1', '#f43f5e', '#10b981', '#f59e0b', '#8b5cf6'] }]
                }
            });

            pieChart = new Chart(ctxPie, {
                type: 'doughnut',
                data: {
                    labels: ['CAL', 'COVID', 'Telemedicina'],
                    datasets: [{ data: [sums.cal, sums.covid, sums.tele], backgroundColor: ['#6366f1', '#f43f5e', '#10b981'] }]
                }
            });
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = data.map(r => `
                <tr class="border-b border-slate-800">
                    <td class="p-4">${r['LOCALIDAD'] || '-'}</td>
                    <td class="p-4">${r['TIPO OPERATIVO'] || '-'}</td>
                    <td class="p-4 text-right">${r['CAL (APLIC)'] || 0}</td>
                </tr>`).join('');
        }

        function showSection(id, btn) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        lucide.createIcons();
        fetchGoogleData();
    </script>
</body>
</html>
